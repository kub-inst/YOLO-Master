# YOLO26n VisDrone 1-Epoch Baseline — Training Config
# 由 train_visdrone.py 生成，记录实际训练参数

model: yolo26n.pt               # YOLO26 Nano COCO pretrained (2.57M params)
data: configs/visdrone.yaml      # VisDrone2019-DET, 10 classes

# Training
epochs: 1
imgsz: 640
batch: 2
device: 0                        # single GPU
workers: 0                       # Windows compatibility
seed: 42

# Optimizer
optimizer: AdamW
lr0: 0.001                       # initial learning rate
lrf: 0.01                        # final LR factor
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation (disabled for smoke test)
mosaic: 1.0
mixup: 0.1
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
fliplr: 0.5

# Misc
amp: true                        # automatic mixed precision
pretrained: true
cls_remap: true                  # auto-rebuild head for 10 classes
# VisDrone2019-DET dataset config for YOLO26n baseline
# 10 classes, UAV perspective, many small objects

path: ../datasets/VisDrone
train: images/train  # 6471 images
val: images/val      # 548 images
test: images/test    # 1610 images

names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor